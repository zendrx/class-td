<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>XO Tournament - UEFA Style</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .sub {
            text-align: center;
            opacity: 0.9;
            margin-bottom: 30px;
        }
        .register-box {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }
        .register-box input {
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            margin: 10px;
            width: 250px;
        }
        .register-box button {
            padding: 12px 30px;
            font-size: 16px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }
        .register-box button:hover {
            background: #ff8c5a;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        .game-panel {
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            padding: 20px;
        }
        .match-info {
            background: rgba(255,255,255,0.15);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        .players {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 15px;
        }
        .player-card {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 15px;
        }
        .player-card h3 {
            margin: 0 0 5px 0;
        }
        .score {
            font-size: 2em;
            font-weight: bold;
            margin: 10px 0;
        }
        .agg {
            font-size: 1.2em;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.3);
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 20px;
            max-width: 400px;
            margin: 20px auto;
        }
        .cell {
            aspect-ratio: 1;
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            color: #333;
        }
        .cell.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        .cell:active {
            transform: scale(0.95);
        }
        .choice-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }
        .choice-btn {
            padding: 10px 30px;
            font-size: 1.5em;
            background: #4c9aff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }
        .choice-btn:hover {
            background: #6eaeff;
        }
        .status {
            text-align: center;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            margin-top: 15px;
        }
        .bracket-panel {
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            padding: 20px;
            overflow-x: auto;
        }
        .bracket {
            display: flex;
            gap: 20px;
            min-width: 800px;
        }
        .round {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .round h3 {
            text-align: center;
            margin-bottom: 10px;
        }
        .match {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 10px;
            font-size: 0.9em;
        }
        .match.winner {
            background: rgba(76, 175, 80, 0.4);
            border: 1px solid #4caf50;
        }
        .admin-panel {
            margin-top: 20px;
            background: rgba(255,0,0,0.2);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .admin-panel button {
            background: #ff4444;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .players-list {
            margin-top: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 15px;
        }
        .player-tag {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 5px 12px;
            margin: 5px;
            border-radius: 20px;
            font-size: 0.9em;
        }
        .error {
            color: #ffaaaa;
            margin-top: 10px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .waiting {
            animation: pulse 1s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 XO UEFA Tournament</h1>
        <div class="sub">Two legs + possible 3rd leg • Winners advance</div>
        
        <div class="register-box" id="registerBox">
            <h3>Enter your WhatsApp name</h3>
            <input type="text" id="playerName" placeholder="e.g., John Doe">
            <button id="registerBtn">Join Tournament</button>
            <div id="registerError" class="error"></div>
        </div>
        
        <div id="gameContent" style="display: none;">
            <div class="main-grid">
                <div class="game-panel">
                    <div class="match-info">
                        <div class="players">
                            <div class="player-card">
                                <h3 id="playerAName">Player A</h3>
                                <div class="score" id="scoreA">0</div>
                                <div id="choiceStatusA" style="font-size:0.8em"></div>
                            </div>
                            <div class="player-card">
                                <h3>VS</h3>
                                <div class="agg" id="aggregate">Agg: 0-0</div>
                                <div>Leg <span id="legNumber">1</span>/3</div>
                            </div>
                            <div class="player-card">
                                <h3 id="playerBName">Player B</h3>
                                <div class="score" id="scoreB">0</div>
                                <div id="choiceStatusB" style="font-size:0.8em"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div id="choicePanel" style="text-align:center">
                        <p>Choose X or O for this leg:</p>
                        <div class="choice-buttons">
                            <button class="choice-btn" data-choice="X">❌ X</button>
                            <button class="choice-btn" data-choice="O">⭕ O</button>
                        </div>
                    </div>
                    
                    <div class="board" id="board">
                        <!-- 9 cells -->
                    </div>
                    
                    <div class="status" id="statusMsg">Waiting for match to start...</div>
                </div>
                
                <div class="bracket-panel">
                    <h3>🏆 Tournament Bracket</h3>
                    <div class="bracket" id="bracket"></div>
                </div>
            </div>
            
            <div id="adminPanel" class="admin-panel" style="display: none;">
                <button id="forceNextBtn">⏩ Admin: Force Next Match</button>
                <button id="resetTournamentBtn">🔄 Admin: Reset Tournament</button>
            </div>
            
            <div class="players-list">
                <strong>👥 Players in tournament:</strong>
                <div id="playersList"></div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let myPlayer = null;
        let currentState = null;
        
        // DOM elements
        const registerBox = document.getElementById('registerBox');
        const gameContent = document.getElementById('gameContent');
        const registerBtn = document.getElementById('registerBtn');
        const playerNameInput = document.getElementById('playerName');
        const registerError = document.getElementById('registerError');
        
        // Register
        registerBtn.addEventListener('click', () => {
            const name = playerNameInput.value.trim();
            if (!name) {
                registerError.textContent = 'Please enter your name';
                return;
            }
            const isAdmin = (name.toLowerCase() === 'zendrx');
            socket.emit('register', { name, isAdmin });
        });
        
        socket.on('registered', (data) => {
            if (data.success) {
                myPlayer = data.player;
                registerBox.style.display = 'none';
                gameContent.style.display = 'block';
                if (myPlayer.isAdmin) {
                    document.getElementById('adminPanel').style.display = 'flex';
                }
            } else {
                registerError.textContent = data.error;
            }
        });
        
        // State updates
        socket.on('stateUpdate', (state) => {
            currentState = state;
            updateUI();
        });
        
        function updateUI() {
            if (!currentState) return;
            
            // Update players list
            const playersListDiv = document.getElementById('playersList');
            playersListDiv.innerHTML = currentState.players.map(p => `<span class="player-tag">${p.name}${p.isAdmin ? ' 👑' : ''}</span>`).join('');
            
            if (!currentState.tournamentStarted) {
                document.getElementById('statusMsg').innerHTML = 'Waiting for more players to join... (need 16 or type /start)';
                return;
            }
            
            if (!currentState.currentMatch) {
                document.getElementById('statusMsg').innerHTML = 'Tournament in progress... loading next match';
                return;
            }
            
            const match = currentState.currentMatch;
            const playerA = match.playerA;
            const playerB = match.playerB;
            
            // Player names
            document.getElementById('playerAName').innerHTML = `${playerA.name} ${playerA.id === myPlayer?.id ? '(YOU)' : ''}`;
            document.getElementById('playerBName').innerHTML = `${playerB.name} ${playerB.id === myPlayer?.id ? '(YOU)' : ''}`;
            document.getElementById('scoreA').innerHTML = match.aggregate.A;
            document.getElementById('scoreB').innerHTML = match.aggregate.B;
            document.getElementById('aggregate').innerHTML = `Agg: ${match.aggregate.A} - ${match.aggregate.B}`;
            document.getElementById('legNumber').innerHTML = match.leg;
            
            // Choice status
            if (match.xoChoice) {
                document.getElementById('choiceStatusA').innerHTML = match.xoChoice.A ? `Chose ${match.xoChoice.A}` : 'Waiting...';
                document.getElementById('choiceStatusB').innerHTML = match.xoChoice.B ? `Chose ${match.xoChoice.B}` : 'Waiting...';
            }
            
            // Show/hide choice panel
            const isPlayerInMatch = (myPlayer && (playerA.id === myPlayer.id || playerB.id === myPlayer.id));
            const needChoice = (!match.playerASymbol && isPlayerInMatch && match.gameActive);
            document.getElementById('choicePanel').style.display = needChoice ? 'block' : 'none';
            
            // Update board
            const boardDiv = document.getElementById('board');
            boardDiv.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (!match.gameActive || match.legOver) cell.classList.add('disabled');
                else if (!isPlayerInMatch) cell.classList.add('disabled');
                else if (match.turn !== (playerA.id === myPlayer?.id ? match.playerASymbol : (playerB.id === myPlayer?.id ? match.playerBSymbol : null))) cell.classList.add('disabled');
                
                cell.textContent = match.board[i] || '';
                cell.addEventListener('click', () => {
                    if (!match.gameActive || match.legOver) return;
                    if (!isPlayerInMatch) return;
                    const mySymbol = playerA.id === myPlayer?.id ? match.playerASymbol : (playerB.id === myPlayer?.id ? match.playerBSymbol : null);
                    if (match.turn !== mySymbol) return;
                    if (match.board[i] !== null) return;
                    socket.emit('makeMove', { playerId: myPlayer.id, index: i });
                });
                boardDiv.appendChild(cell);
            }
            
            // Status message
            let statusMsg = '';
            if (!match.gameActive && match.legOver) {
                if (match.legWinner === null) statusMsg = '🤝 Draw! Moving to next leg...';
                else statusMsg = `🏆 ${match.legWinner === 'A' ? playerA.name : playerB.name} wins this leg!`;
            } else if (!match.playerASymbol && isPlayerInMatch) {
                statusMsg = 'Choose X or O above to start';
            } else if (!match.gameActive) {
                statusMsg = 'Leg over. Next leg starting soon...';
            } else if (match.turn && isPlayerInMatch) {
                const mySymbol = playerA.id === myPlayer?.id ? match.playerASymbol : (playerB.id === myPlayer?.id ? match.playerBSymbol : null);
                if (match.turn === mySymbol) statusMsg = '🎯 Your turn! Click a cell';
                else statusMsg = `Waiting for ${match.turn === match.playerASymbol ? playerA.name : playerB.name}...`;
            } else if (!isPlayerInMatch) {
                statusMsg = '👀 Watching match...';
            }
            document.getElementById('statusMsg').innerHTML = statusMsg;
            
            // Render bracket
            renderBracket();
        }
        
        function renderBracket() {
            if (!currentState.matches) return;
            const bracketDiv = document.getElementById('bracket');
            bracketDiv.innerHTML = '';
            
            // Group matches by round
            const rounds = [];
            let size = currentState.matches.length;
            let roundSize = size;
            while (roundSize >= 1) {
                rounds.push([]);
                roundSize = Math.floor(roundSize / 2);
            }
            
            let roundIdx = 0;
            for (let i = 0; i < currentState.matches.length; i++) {
                if (i > 0 && Math.log2(i+1) % 1 === 0) roundIdx++;
                if (!rounds[roundIdx]) rounds[roundIdx] = [];
                rounds[roundIdx].push(currentState.matches[i]);
            }
            
            rounds.forEach((round, idx) => {
                const roundDiv = document.createElement('div');
                roundDiv.className = 'round';
                roundDiv.innerHTML = `<h3>${idx === 0 ? 'Round of ' + (round.length*2) : idx === rounds.length-1 ? 'FINAL' : `Round ${idx+1}`}</h3>`;
                round.forEach(match => {
                    const matchDiv = document.createElement('div');
                    matchDiv.className = 'match';
                    if (match.winner) matchDiv.classList.add('winner');
                    matchDiv.innerHTML = `
                        <div>${match.playerA?.name || 'TBD'}</div>
                        <div>vs</div>
                        <div>${match.playerB?.name || 'TBD'}</div>
                        ${match.winner ? `<div>🏆 Winner: ${match.winner.name}</div>` : ''}
                    `;
                    roundDiv.appendChild(matchDiv);
                });
                bracketDiv.appendChild(roundDiv);
            });
        }
        
        // Choice buttons
        document.querySelectorAll('.choice-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const choice = e.target.dataset.choice;
                if (myPlayer && currentState?.currentMatch && currentState.currentMatch.gameActive && !currentState.currentMatch.playerASymbol) {
                    socket.emit('chooseXO', { playerId: myPlayer.id, choice });
                }
            });
        });
        
        // Admin buttons
        document.getElementById('forceNextBtn')?.addEventListener('click', () => {
            if (myPlayer?.isAdmin) socket.emit('adminForceNext');
        });
        document.getElementById('resetTournamentBtn')?.addEventListener('click', () => {
            if (myPlayer?.isAdmin && confirm('Reset entire tournament? All progress lost.')) {
                socket.emit('adminReset');
                location.reload();
            }
        });
    </script>
</body>
</html>
